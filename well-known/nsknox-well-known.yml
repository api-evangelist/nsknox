source: >-
  Direct unauthenticated HTTP probes of every nsKnox host discovered in this pass:
  the marketing site (nsknox.net), the two customer portals linked from
  https://nsknox.net/login/ (accountvalidation.nsknox.net, verify.nsknox.net) and the
  PaymentKnox API host named in those portals' own Content-Security-Policy connect-src
  (pknox.nsknox.net).
note: >-
  Every probed /.well-known/ path missed. nsknox.net returns a real nginx 404 for all of
  them. The two portals are Angular single-page apps whose origin answers every unknown
  path with the SPA shell under an HTTP 404, so nothing there is a document. pknox.nsknox.net
  sits behind a BIG-IP ASM WAF that answers every path — including /robots.txt — with an
  HTTP 200 "Request Rejected" HTML page, so no status from that host can be read as a
  document either. NO WellKnown or SecurityTxt pointer is emitted in apis.yml: this file
  records a measured absence, not a served surface.
