aid: nsknox
name: nsKnox
description: >-
  nsKnox is an Israeli fintech-security company that protects business-to-business payments
  against fraud and misdirection for corporations and banks. Founded and led by Alon Cohen,
  the founder and former CEO of CyberArk, nsKnox built its platform on a patented Cooperative
  Cyber Security (CCS) architecture in which payment and bank-account data is shredded and
  distributed across multiple independent "Knoxer" systems so that no single breach reveals
  anything. Its PaymentKnox product line covers outgoing payments (accounts payable),
  incoming payments (accounts receivable), Bank Account Certificates, Master Data Guard,
  Payment Check, and an Adaptive Payment Security service that validates payee bank accounts
  worldwide using Quick Check in-network lookups and Knox Verify out-of-network mini-transactions
  against the banking system. Customers connect through a hosted portal, scheduled file transfer,
  or a direct ERP API integration with systems such as SAP and Oracle. nsKnox publishes no public
  developer portal, API reference, or machine-readable specification; the API surface is documented
  to onboarded customers only.
